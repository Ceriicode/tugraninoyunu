<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2b1a12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>TUĞRA – Dev Evden Kaçış</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap">
<style>
/* Yerleşim: tam ekran 3D sahne, üstünde HTML katmanları (menü, HUD, paneller) */
:root{
  --ink:#2b1a12;      /* koyu kahve - kilim zemini */
  --sand:#f6e7c8;     /* kum rengi metin/panel */
  --orange:#e07b39;   /* kilim turuncusu - ana vurgu */
  --green:#2f7d4f;    /* eşofman yeşili */
  --teal:#6fa3a0;     /* tişört rengi */
  --red:#d9483b;
  --display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--sand);font-family:var(--body);
  touch-action:none;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
#game{position:fixed;inset:0}
#game canvas{display:block;width:100%;height:100%}
.layer{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));z-index:5}
[hidden]{display:none!important}

/* Kilim desenli şerit - salondaki minderlerden */
.kilim{height:14px;border-radius:4px;background:
  linear-gradient(135deg,transparent 33%,var(--orange) 33% 66%,transparent 66%) 0 0/14px 14px,
  linear-gradient(45deg,transparent 33%,var(--green) 33% 66%,transparent 66%) 7px 0/14px 14px,
  #f3e2c4}

.panel{background:rgba(43,26,18,.88);border:3px solid #f3e2c4;border-radius:22px;
  width:min(560px,100%);max-height:100%;overflow:auto;padding:18px 20px 20px;display:flex;flex-direction:column;gap:14px;
  box-shadow:0 12px 0 rgba(0,0,0,.35);touch-action:pan-y}
.title{font-family:var(--display);font-weight:800;font-size:clamp(56px,16vw,96px);line-height:.85;margin:0;
  letter-spacing:.02em;color:var(--sand);text-shadow:0 5px 0 var(--orange),0 9px 0 rgba(0,0,0,.35);text-align:center}
.sub{font-family:var(--display);font-weight:600;font-size:clamp(18px,4.6vw,24px);margin:0;text-align:center;color:#f3c99b}
h2{font-family:var(--display);font-weight:800;font-size:clamp(30px,8vw,44px);margin:0;line-height:1;text-align:center;text-wrap:balance}
p{margin:0;line-height:1.45}
.btn{font-family:var(--display);font-weight:800;font-size:22px;border:0;border-radius:16px;padding:12px 18px;cursor:pointer;
  background:var(--orange);color:var(--ink);box-shadow:0 5px 0 #9b4a1b;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #9b4a1b}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
.btn.alt{background:var(--sand);box-shadow:0 5px 0 #b59a6c}
.btn.green{background:#6cc58c;box-shadow:0 5px 0 #2f7d4f}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lv{font-family:var(--display);font-weight:800;font-size:20px;aspect-ratio:1;border-radius:14px;border:2px solid #f3e2c4;
  background:#4a3022;color:var(--sand);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;padding:2px}
.lv small{font-family:var(--body);font-size:9px;font-weight:800;opacity:.85;margin-top:3px;text-align:center}
.lv.done{background:var(--green)}
.lv.next{background:var(--orange);color:var(--ink)}
.lv:disabled{opacity:.35;cursor:default}
.hint{font-size:14px;opacity:.85;text-align:center}
.face{width:74px;height:74px;border-radius:50%;border:3px solid var(--orange);object-fit:cover;background:#4a3022}
.head{display:flex;align-items:center;justify-content:center;gap:14px}
.dances{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.dances .btn{font-size:17px;padding:10px 8px}
.dances .btn:disabled{opacity:.35}

/* Oyun içi gösterge (HUD) */
#hud{position:fixed;left:0;right:0;top:0;z-index:4;pointer-events:none;
  padding:max(10px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));
  display:flex;flex-direction:column;gap:6px}
.hudrow{display:flex;align-items:center;gap:10px;justify-content:space-between}
.chip{background:rgba(43,26,18,.78);border-radius:12px;padding:5px 11px;font-family:var(--display);font-weight:800;font-size:18px;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.hearts{color:var(--red);letter-spacing:2px}
.prog{height:12px;border-radius:8px;background:rgba(43,26,18,.7);overflow:hidden;border:2px solid rgba(246,231,200,.6)}
.prog>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),#6cc58c)}
.iconbtn{pointer-events:auto;border:0;border-radius:12px;width:42px;height:38px;background:rgba(43,26,18,.78);color:var(--sand);
  font-family:var(--display);font-weight:800;font-size:18px;cursor:pointer}
#toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:6;pointer-events:none;font-family:var(--display);font-weight:800;
  font-size:clamp(22px,6vw,34px);color:#fff;text-shadow:0 3px 0 var(--ink),0 0 12px rgba(0,0,0,.4);opacity:0;transition:opacity .25s;text-align:center;white-space:nowrap}
#danceName{position:fixed;left:0;right:0;top:max(18px,env(safe-area-inset-top));z-index:5;text-align:center;pointer-events:none;
  font-family:var(--display);font-weight:800;font-size:clamp(28px,8vw,52px);color:#fff;text-shadow:0 4px 0 var(--orange),0 8px 0 rgba(0,0,0,.4)}

/* Dokunmatik butonlar (telefon/tablet) */
#touch{position:fixed;left:0;right:0;bottom:0;z-index:4;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;
  padding:0 max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
#touch .grp{display:flex;gap:10px}
.tb{pointer-events:auto;width:64px;height:64px;border-radius:50%;border:3px solid rgba(246,231,200,.7);background:rgba(43,26,18,.45);
  color:var(--sand);font-size:26px;font-weight:800;display:flex;align-items:center;justify-content:center;touch-action:none}
.tb:active{background:rgba(224,123,57,.7)}
@media (hover:hover) and (pointer:fine){#touch{display:none}}
@media (max-height:460px){.title{font-size:54px}.panel{gap:10px;padding:12px 16px}}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>
<div id="game"></div>

<!-- Oyun içi gösterge -->
<div id="hud" hidden>
  <div class="hudrow">
    <span class="chip" id="hLevel">1 · Çocuk Odası</span>
    <span style="display:flex;gap:6px">
      <button class="iconbtn" id="bSound" aria-label="Ses aç/kapat">♪</button>
      <button class="iconbtn" id="bPause" aria-label="Duraklat">II</button>
    </span>
  </div>
  <div class="prog"><i id="hProg"></i></div>
  <div class="hudrow">
    <span class="chip hearts" id="hHearts">♥♥♥</span>
    <span class="chip" id="hItems">Eşya 0</span>
    <span class="chip" id="hScore">0</span>
  </div>
</div>
<div id="toast"></div>
<div id="danceName" hidden></div>

<div id="touch" hidden>
  <div class="grp"><div class="tb" data-act="left" aria-label="Sola">◀</div><div class="tb" data-act="right" aria-label="Sağa">▶</div></div>
  <div class="grp"><div class="tb" data-act="slide" aria-label="Kay">▼</div><div class="tb" data-act="jump" aria-label="Zıpla">▲</div></div>
</div>

<!-- Ana menü -->
<div class="layer" id="menu">
  <div class="panel">
    <div class="kilim"></div>
    <h1 class="title">TUĞRA</h1>
    <p class="sub">Dev Evden Büyük Kaçış</p>
    <div class="head"><img class="face" id="menuFace" alt="Tuğra"><p style="max-width:300px">Bir kedi kadar küçüldün! Engellerden kaç, eşyaları topla, kapıya ulaş ve dansını yap.</p></div>
    <button class="btn" id="bPlay">OYNA</button>
    <div class="levels" id="levels"></div>
    <div class="row">
      <button class="btn alt" id="bGallery">Dans Salonu</button>
    </div>
    <p class="hint" id="ctrlHint"></p>
    <div class="kilim"></div>
  </div>
</div>

<!-- Dans salonu -->
<div class="layer" id="gallery" hidden>
  <div class="panel">
    <h2>Dans Salonu</h2>
    <p class="hint">Bölüm geçtikçe yeni danslar açılır.</p>
    <div class="dances" id="danceList"></div>
    <button class="btn alt" id="bGalBack">Menüye dön</button>
  </div>
</div>

<!-- Duraklatma -->
<div class="layer" id="pause" hidden>
  <div class="panel">
    <h2>Mola</h2>
    <div class="row"><button class="btn green" id="bResume">Devam</button><button class="btn alt" id="bPauseMenu">Menü</button></div>
  </div>
</div>

<!-- Yakalandın -->
<div class="layer" id="over" hidden>
  <div class="panel">
    <h2>Eyvah, takıldın!</h2>
    <p class="hint" id="overInfo"></p>
    <div class="row"><button class="btn" id="bRetry">Tekrar dene</button><button class="btn alt" id="bOverMenu">Menü</button></div>
  </div>
</div>

<!-- Bölüm sonu (dans sırasında altta) -->
<div class="layer" id="win" hidden style="align-items:flex-end;pointer-events:none">
  <div class="panel" style="pointer-events:auto;width:min(520px,100%)">
    <p class="sub" id="winInfo"></p>
    <div class="row">
      <button class="btn green" id="bNext">Sonraki bölüm</button>
      <button class="btn alt" id="bWinMenu">Menü</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

const geoCache = {};
const G = (key, fn) => geoCache[key] || (geoCache[key] = fn());   // geometri önbelleği
const matCache = {};
function M(color, extra){ // paylaşılan malzeme
  const k = color + JSON.stringify(extra||{});
  return matCache[k] || (matCache[k] = new THREE.MeshStandardMaterial(Object.assign({color, roughness:.8, metalness:0}, extra||{})));
}
function box(w,h,d,color,extra){ const m = new THREE.Mesh(G(`b${w}_${h}_${d}`,()=>new THREE.BoxGeometry(w,h,d)), M(color,extra)); m.castShadow = m.receiveShadow = true; return m; }
function cyl(rt,rb,h,color,seg=16,extra){ const m = new THREE.Mesh(G(`c${rt}_${rb}_${h}_${seg}`,()=>new THREE.CylinderGeometry(rt,rb,h,seg)), M(color,extra)); m.castShadow = m.receiveShadow = true; return m; }
function sph(r,color,extra){ const m = new THREE.Mesh(G(`s${r}`,()=>new THREE.SphereGeometry(r,20,14)), M(color,extra)); m.castShadow = true; return m; }
const rand = (a,b) => a + Math.random()*(b-a);
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
function canvasTex(w,h,draw,rep){ const c=document.createElement('canvas'); c.width=w; c.height=h; draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c); t.anisotropy=4;
  if (rep){ t.wrapS=t.wrapT=THREE.RepeatWrapping; } return t; }

// ---------- Zemin ve duvar dokuları ----------
function floorTexture(L){
  const [a,b] = L.f;
  return canvasTex(256,256,(g,w,h)=>{
    if (L.floor==='plank'){ // ahşap parke (koşu yönünde uzun)
      for (let i=0;i<4;i++){ g.fillStyle = i%2?a:b; g.fillRect(i*64,0,64,h);
        g.fillStyle='rgba(0,0,0,.25)'; g.fillRect(i*64,0,3,h); g.fillRect(i*64,(i*97)%256,64,3);
        g.fillStyle='rgba(255,255,255,.06)'; for(let k=0;k<6;k++) g.fillRect(i*64+8+k*9,0,2,h); }
    } else if (L.floor==='tile'){ g.fillStyle=a; g.fillRect(0,0,w,h); g.fillStyle=b; g.fillRect(0,0,w,6); g.fillRect(0,128,w,6); g.fillRect(0,0,6,h); g.fillRect(128,0,6,h);
    } else if (L.floor==='checker'){ for(let x=0;x<2;x++)for(let y=0;y<2;y++){ g.fillStyle=(x+y)%2?b:a; g.fillRect(x*128,y*128,128,128);}
    } else if (L.floor==='carpet'){ g.fillStyle=a; g.fillRect(0,0,w,h); g.fillStyle=b;
      for(let y=0;y<256;y+=64){ g.beginPath(); g.arc(64,y+32,22,0,7); g.arc(192,y+32,22,0,7); g.fill(); }
    } else { // kilim: elmas desen
      g.fillStyle='#f3e2c4'; g.fillRect(0,0,w,h);
      const dia=(cx,cy,r,col)=>{ g.fillStyle=col; g.beginPath(); g.moveTo(cx,cy-r); g.lineTo(cx+r,cy); g.lineTo(cx,cy+r); g.lineTo(cx-r,cy); g.fill(); };
      dia(128,128,120,'#7a4a2a'); dia(128,128,92,a); dia(128,128,60,'#f3e2c4'); dia(128,128,34,b);
      dia(0,0,40,b); dia(256,0,40,b); dia(0,256,40,b); dia(256,256,40,b);
    }
  }, true);
}
function wallTexture(L){
  return canvasTex(256,256,(g,w,h)=>{
    g.fillStyle=L.wall; g.fillRect(0,0,w,h);
    g.fillStyle=L.wall2; for (let x=0;x<w;x+=32) g.fillRect(x,0,14,h); // çizgili duvar kağıdı
  }, true);
}

function applyTheme(L){
  const ft = floorTexture(L); ft.repeat.set(L.floor==='kilim'?3:6, CORR_LEN/ (L.floor==='kilim'?10:5));
  if (floorMat.map) floorMat.map.dispose(); floorMat.map = ft; floorMat.needsUpdate = true;
  const wt = wallTexture(L); wt.repeat.set(CORR_LEN/20, 2);
  const wt2 = wt.clone(); wt2.needsUpdate = true;
  if (wallMatL.map) wallMatL.map.dispose(); if (wallMatR.map) wallMatR.map.dispose();
  wallMatL.map = wt; wallMatR.map = wt2; wallMatL.needsUpdate = wallMatR.needsUpdate = true;
  const fc = new THREE.Color(L.wall).lerp(new THREE.Color('#ffffff'), .25);
  scene.fog.color.copy(fc); scene.background.copy(fc);
}

function makeTugra(){
  const SKIN='#d9a07a', SHIRT='#6fa3a0', PANTS='#1f7a46', SOCK='#151515', HAIR='#2a1c14', BAND='#f2f0ea';
  const root = new THREE.Group();         // dünya konumu
  const body = new THREE.Group();         // eğilme/zıplama
  root.add(body);
  const hips = new THREE.Group(); hips.position.y = .62; body.add(hips);
  const pelvis = box(.44,.16,.26,PANTS); pelvis.position.y = .02; hips.add(pelvis);

  // Bacaklar: kalça pivotu -> uyluk -> diz pivotu -> baldır + çorap
  function leg(side){
    const hip = new THREE.Group(); hip.position.set(side*.12, 0, 0); hips.add(hip);
    const thigh = box(.18,.34,.2,PANTS); thigh.position.y = -.16; hip.add(thigh);
    const knee = new THREE.Group(); knee.position.y = -.32; hip.add(knee);
    const shin = box(.17,.26,.18,PANTS); shin.position.y = -.12; knee.add(shin);
    const cuff = box(.18,.05,.19,'#17633a'); cuff.position.y = -.24; knee.add(cuff);
    const foot = box(.17,.08,.3,SOCK); foot.position.set(0,-.28,-.05); knee.add(foot);
    return {hip, knee};
  }
  const L = leg(-1), R = leg(1);

  const torso = new THREE.Group(); torso.position.y = .08; hips.add(torso);
  const shirtMats = [M(SHIRT),M(SHIRT),M(SHIRT),M(SHIRT),M(SHIRT), new THREE.MeshStandardMaterial({map:makeShirtFront(), roughness:.85})];
  const shirt = new THREE.Mesh(G('shirt',()=>new THREE.BoxGeometry(.5,.5,.28)), shirtMats);
  shirt.position.y = .22; shirt.castShadow = true; torso.add(shirt);
  const neck = cyl(.07,.07,.08,SKIN); neck.position.y = .5; torso.add(neck);

  // Kollar: omuz pivotu -> kısa kollu tişört + üst kol -> dirsek -> ön kol + bileklik + el
  function arm(side){
    const sh = new THREE.Group(); sh.position.set(side*.31, .42, 0); torso.add(sh);
    const sleeve = box(.17,.18,.19,SHIRT); sleeve.position.y = -.06; sh.add(sleeve);
    const upper = box(.12,.14,.13,SKIN); upper.position.y = -.2; sh.add(upper);
    const el = new THREE.Group(); el.position.y = -.26; sh.add(el);
    const fore = box(.11,.2,.12,SKIN); fore.position.y = -.09; el.add(fore);
    const band = cyl(.085,.085,.08,BAND,12); band.position.y = -.17; el.add(band);
    const hand = sph(.075,SKIN); hand.position.y = -.25; el.add(hand);
    return {sh, el};
  }
  const AL = arm(-1), AR = arm(1);

  // Kafa: fotoğraftaki yüz, kameraya HER ZAMAN dönük duran büyük "foto kafa" (Sprite)
  // Böylece koşarken arkadan bakınca da, dansta önden bakınca da yüzü net görünür
  const head = new THREE.Group(); head.position.y = .55; torso.add(head);
  const faceSprite = new THREE.Sprite(new THREE.SpriteMaterial({map:faceTex, transparent:true, alphaTest:.05, depthWrite:true}));
  faceSprite.scale.set(.74, 1.0, 1);      // fotoğraf oranı 400x540
  faceSprite.position.y = .42; faceSprite.center.set(.5,.5);
  faceSprite.renderOrder = 2; head.add(faceSprite);
  // Gölge için görünmez bir kafa (Sprite gölge atmaz)
  const shadowHead = new THREE.Mesh(G('shead',()=>new THREE.SphereGeometry(.34,12,10)), new THREE.MeshBasicMaterial({colorWrite:false, depthWrite:false}));
  shadowHead.position.y = .42; shadowHead.scale.y = 1.3; shadowHead.castShadow = true; head.add(shadowHead);

  root.scale.setScalar(.95);
  root.traverse(o => { if (o.isMesh) o.castShadow = true; });
  faceTex.anisotropy = 4;
  scene.add(root);
  return {root, body, hips, torso, head, faceSprite, hipL:L.hip, hipR:R.hip, knL:L.knee, knR:R.knee, shL:AL.sh, shR:AR.sh, elL:AL.el, elR:AR.el};
}

// ---------- SES (WebAudio ile üretilen müzik ve efektler) ----------
let AC = null, master = null, musicGain = null, muted = false;
try { muted = localStorage.getItem('tugra_mute') === '1'; } catch(e){}
function audio(){
  if (!AC){ const A = window.AudioContext || window.webkitAudioContext; if (!A) return null;
    AC = new A(); master = AC.createGain(); master.gain.value = muted?0:.55; master.connect(AC.destination);
    musicGain = AC.createGain(); musicGain.gain.value = .5; musicGain.connect(master); }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
const mtof = m => 440*Math.pow(2,(m-69)/12);
function tone(freq, dur, type='square', vol=.15, when=0, dest, slideTo){
  if (!AC) return; const t0 = AC.currentTime + when;
  const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0+dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.0001, t0+dur);
  o.connect(g); g.connect(dest||master); o.start(t0); o.stop(t0+dur+.02);
}
let noiseBuf = null;
function noise(dur, vol, when=0, hp=1000, dest){
  if (!AC) return; if (!noiseBuf){ noiseBuf = AC.createBuffer(1, AC.sampleRate*.5, AC.sampleRate); const d = noiseBuf.getChannelData(0); for (let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
  const t0 = AC.currentTime + when, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; f.type='highpass'; f.frequency.value = hp; g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  s.connect(f); f.connect(g); g.connect(dest||master); s.start(t0); s.stop(t0+dur+.02);
}

  hit(){ noise(.25,.3,0,200); tone(160,.3,'sawtooth',.15,0,null,60); },
  win(){ [0,4,7,12,16].forEach((n,i)=>tone(mtof(72+n),.22,'square',.1,i*.09)); },

};
// Basit 16 adımlı müzik sıralayıcı
let seq = null;
function makeTrack(seed, bpm, root, style){
  let s = seed*9301+49297; const r = ()=> (s = (s*9301+49297)%233280)/233280;
  const scale = [0,2,4,7,9,12,14,16];         // pentatonik: her nota iyi duyulur
  const lead = Array.from({length:32}, (_,i)=> (i%2 && r()<.45) ? null : scale[Math.floor(r()*scale.length)]);
  const bassSteps = [0,0,7,5,0,0,10,7].map(x=>x-12);
  return {bpm, root, style, lead, bassSteps};
}
const RUN_TRACK = makeTrack(3, 150, 60, 'run');
const DANCE_TRACKS = DANCE_BPM.map((bpm,i)=> makeTrack(i+11, bpm, [60,62,57,59,64,55,58,60,61,63][i], i%3));
function playMusic(track){
  stopMusic(); if (!audio()) return;
  seq = {track, step:0, next: AC.currentTime + .05, id: setInterval(tick, 25)};
  function tick(){
    if (!seq) return; const tr = seq.track, stepDur = 60/tr.bpm/4;
    while (seq.next < AC.currentTime + .12){
      const i = seq.step, w = seq.next - AC.currentTime, d = musicGain;
      if (i%4===0) tone(140,.18,'sine',.5,w,d,45);                         // davul (kick)
      if (i%8===4) noise(.12,.25,w,1500,d);                                // trampet
      if (i%2===1 || tr.style===2) noise(.04,.07,w,7000,d);                // zil (hihat)
      if (i%2===0) tone(mtof(tr.root + tr.bassSteps[(i>>1)%8]), stepDur*1.8,'triangle',.22,w,d);  // bas
      const n = tr.lead[i%32]; if (n!==null && (tr.style!=='run' || i%2===0))
        tone(mtof(tr.root+12+n), stepDur*1.5, tr.style===1?'sawtooth':'square', tr.style==='run'?.035:.06, w, d);
      seq.step++; seq.next += stepDur;
    }
  }
}
function stopMusic(){ if (seq){ clearInterval(seq.id); seq = null; } }

let state = 'menu', lvl = 0, dist = 0, speed = 12, levelLen = 600, nextSpawn = 30, nextDecor = 0;

// Desen üretici: bölüme göre zorlaşır
function spawnPattern(od){
  const L = lvl, r = Math.random();
  const lanes = [0,1,2].sort(()=>Math.random()-.5);
  const low = ['books','block','slipper'];
  const tall = ['carton','vase'];
  if (r < .22){ // tek alçak engel + yan şeritte eşyalar
    addObstacle(pick(low), lanes[0], od); itemLine(lanes[0], od-4, 4, 1.4);
  } else if (r < .40){ // iki şerit kapalı, biri açık
    addObstacle(pick(tall), lanes[0], od); addObstacle(pick(L<2?tall:[...tall,...low]), lanes[1], od);
    itemLine(lanes[2], od-3, 4);
  } else if (r < .52){ // kanepe altından kay
    addObstacle('sofa', null, od); for (let i=0;i<3;i++) addItem(1, od-1.5+i*1.5, .35);
  } else if (r < .62){ // kablo: zıpla ya da kay
    addObstacle('cable', null, od); itemLine(lanes[0], od+3, 3);
  } else if (r < .74 && L >= 1){ // yuvarlanan top
    addObstacle('ball', lanes[0], od+12); itemLine(lanes[1], od, 5);
  } else if (r < .84 && L >= 2){ // robot süpürge
    addObstacle('robot', 1, od, {amp:2.1, freq:1.2 + L*.08}); itemLine(lanes[0], od+4, 3);
  } else if (r < .93 && L >= 3){ // üç şeritte de alçak engel: zıplamak şart
    for (const ln of [0,1,2]) addObstacle(pick(low), ln, od); itemLine(1, od-4, 5, 1.6);
  } else { // karışık
    addObstacle(pick(tall), lanes[0], od); addObstacle(pick(low), lanes[1], od); itemLine(lanes[2], od-2, 4);
  }
}

function clearLevel(){
  while (levelGroup.children.length) levelGroup.remove(levelGroup.children[0]);
  obstacles = []; items = []; decor = []; door = null;
}

function startLevel(i){
  lvl = i; clearLevel(); applyTheme(LEVELS[i]);
  dist = 0; speed = 12 + i*1.15; levelLen = 520 + i*70; nextSpawn = 28; nextDecor = -10;
  hearts = 3; invul = 0; collected = 0; score = 0; runT = 0;
  lane = 1; px = 0; py = 0; vy = 0; sliding = 0; grounded = true;
  P.root.position.set(0,0,0); P.root.rotation.set(0,0,0); P.root.visible = true;
  door = makeDoor(levelLen);
  discoLights.forEach(l=>l.intensity=0);
  confetti.visible = false; levelGroup.visible = true;
  document.getElementById('hLevel').textContent = `${i+1} · ${LEVELS[i].name}`;
  updateHUD(); show('hud'); hideLayers();
  document.getElementById('touch').hidden = false;
  document.getElementById('danceName').hidden = true;
  state = 'run'; audio(); playMusic(RUN_TRACK);
  toast(LEVELS[i].name, 1400);
}

// ---------- Girdi (klavye, kaydırma, butonlar) ----------
function act(a){
  if (state !== 'run') return;
  if (a==='left' && lane>0){ lane--; SFX.lane(); }
  else if (a==='right' && lane<2){ lane++; SFX.lane(); }
  else if (a==='jump' && grounded){ vy = 8.6; grounded = false; sliding = 0; SFX.jump(); }
  else if (a==='slide'){ if (!grounded) vy = -14; sliding = .75; SFX.slide(); }
}
addEventListener('keydown', e=>{
  const k = e.key;
  if (['ArrowLeft','a','A'].includes(k)) act('left');
  else if (['ArrowRight','d','D'].includes(k)) act('right');
  else if (['ArrowUp','w','W',' '].includes(k)) { act('jump'); e.preventDefault(); }
  else if (['ArrowDown','s','S'].includes(k)) act('slide');
  else if (k==='p' || k==='P' || k==='Escape') togglePause();
});
// Ekranı kaydırma (swipe) — oyunun her yerinde çalışır
let ts = null;
const gameEl = document.getElementById('game');
gameEl.addEventListener('touchstart', e=>{ const t=e.changedTouches[0]; ts={x:t.clientX,y:t.clientY,t:performance.now()}; }, {passive:true});
gameEl.addEventListener('touchend', e=>{
  if (!ts) return; const t=e.changedTouches[0], dx=t.clientX-ts.x, dy=t.clientY-ts.y; ts=null;
  if (Math.max(Math.abs(dx),Math.abs(dy)) < 24){ act('jump'); return; } // dokun = zıpla
  if (Math.abs(dx) > Math.abs(dy)) act(dx<0?'left':'right'); else act(dy<0?'jump':'slide');
}, {passive:true});
// Fare ile sürükleme (bilgisayarda dokunmatik olmayanlar için de)
let ms = null;
gameEl.addEventListener('mousedown', e=>{ ms={x:e.clientX,y:e.clientY}; });
addEventListener('mouseup', e=>{ if(!ms) return; const dx=e.clientX-ms.x, dy=e.clientY-ms.y; ms=null;
  if (Math.max(Math.abs(dx),Math.abs(dy)) < 30) return; if (Math.abs(dx)>Math.abs(dy)) act(dx<0?'left':'right'); else act(dy<0?'jump':'slide'); });
document.querySelectorAll('#touch .tb').forEach(b=> b.addEventListener('pointerdown', e=>{ e.preventDefault(); e.stopPropagation(); audio(); act(b.dataset.act); }));
document.getElementById('ctrlHint').textContent = isTouch
  ? 'Parmağını kaydır: ◀ ▶ şerit değiştir, yukarı zıpla, aşağı kay. Alttaki butonlar da olur.'
  : 'Ok tuşları veya WASD: sağ-sol, ↑/Boşluk zıpla, ↓ kay. P ile mola.';

function updateHUD(){
  $('hHearts').textContent = '♥'.repeat(Math.max(0,hearts)) + '♡'.repeat(Math.max(0,3-hearts));
  $('hItems').textContent = 'Eşya ' + collected;
  $('hScore').textContent = Math.floor(score);
  $('hProg').style.width = Math.min(100, dist/levelLen*100) + '%';
}
function buildMenu(){
  const lv = $('levels'); lv.innerHTML = '';
  LEVELS.forEach((L,i)=>{
    const b = document.createElement('button'); b.className = 'lv' + (save.done.includes(i)?' done':'') + (i===save.unlocked-1 && !save.done.includes(i)?' next':'');
    b.id = 'lv'+i; b.disabled = i >= save.unlocked; b.innerHTML = `${i+1}<small>${L.name}</small>`;
    b.onclick = ()=> startLevel(i); lv.appendChild(b);
  });
  const dl = $('danceList'); dl.innerHTML = '';
  DANCES.forEach((n,i)=>{ const b=document.createElement('button'); b.className='btn alt'; b.id='dn'+i;
    const open = save.done.includes(i); b.disabled = !open; b.textContent = open ? n : `${i+1}. dans 🔒`;
    b.onclick = ()=> startDance(i, true); dl.appendChild(b); });
}
function goMenu(){
  state = 'menu'; stopMusic(); hideLayers(); buildMenu(); show('menu');
  $('hud').hidden = true; $('touch').hidden = true; $('danceName').hidden = true;
  clearLevel(); applyTheme(LEVELS[Math.min(save.unlocked-1,9)]);
  discoLights.forEach(l=>l.intensity=0); confetti.visible = false;
  P.root.position.set(0,0,0); P.root.visible = true; px = 0; py = 0;
}
$('bPlay').onclick = ()=> startLevel(Math.min(save.unlocked-1, 9));
$('bGallery').onclick = ()=>{ hideLayers(); buildMenu(); show('gallery'); };
$('bGalBack').onclick = goMenu;
$('bResume').onclick = togglePause;
$('bPauseMenu').onclick = goMenu;
$('bRetry').onclick = ()=> startLevel(lvl);
$('bOverMenu').onclick = goMenu;
$('bWinMenu').onclick = goMenu;
$('bNext').onclick = ()=>{ if (galleryMode){ hideLayers(); show('gallery'); state='menu'; stopMusic(); $('danceName').hidden=true; discoLights.forEach(l=>l.intensity=0); confetti.visible=false; return; }
  if (lvl < 9) startLevel(lvl+1); else goMenu(); };
$('bPause').onclick = togglePause;
$('bSound').onclick = ()=>{ audio(); setMute(!muted); };
setMute(muted);
function togglePause(){
  if (state === 'run'){ state = 'paused'; stopMusic(); show('pause'); }
  else if (state === 'paused'){ hideLayers(); state = 'run'; playMusic(RUN_TRACK); }
}
document.addEventListener('visibilitychange', ()=>{ if (document.hidden && state==='run') togglePause(); });

// ---------- Konfeti ----------
const CONF_N = 260;
const confGeo = new THREE.BufferGeometry();
const confPos = new Float32Array(CONF_N*3), confCol = new Float32Array(CONF_N*3), confVel = new Float32Array(CONF_N);
const palette = [new THREE.Color('#ff4d6d'),new THREE.Color('#ffd23f'),new THREE.Color('#3bceac'),new THREE.Color('#4cc9f0'),new THREE.Color('#e07b39')];
for (let i=0;i<CONF_N;i++){ confPos[i*3]=rand(-5,5); confPos[i*3+1]=rand(0,8); confPos[i*3+2]=rand(-4,3); const c=pick(palette); c.toArray(confCol,i*3); confVel[i]=rand(1,2.6); }
confGeo.setAttribute('position', new THREE.BufferAttribute(confPos,3));
confGeo.setAttribute('color', new THREE.BufferAttribute(confCol,3));
const confetti = new THREE.Points(confGeo, new THREE.PointsMaterial({size:.13, vertexColors:true}));
confetti.visible = false; scene.add(confetti);

// ---------- Kazanma / kaybetme ----------
function winLevel(){
  if (!save.done.includes(lvl)) save.done.push(lvl);
  save.unlocked = Math.max(save.unlocked, Math.min(10, lvl+2)); storeSave();
  SFX.win(); startDance(lvl, false);
  const last = lvl === 9;
  $('winInfo').textContent = last
    ? `Evden kaçtın! ${collected} eşya topladın. Bütün danslar açıldı!`
    : `${lvl+1}. bölüm bitti! ${collected} eşya, ${Math.floor(score)} puan.`;
  $('bNext').textContent = last ? 'Menüye dön' : 'Sonraki bölüm';
}
function startDance(i, fromGallery){
  galleryMode = fromGallery; danceIdx = i; danceT = 0; state = 'dance';
  hideLayers(); $('hud').hidden = true; $('touch').hidden = true;
  levelGroup.visible = false; confetti.visible = true; discoLights.forEach(l=>l.intensity=1.1);
  P.root.visible = true; py = 0; sliding = 0;
  const dn = $('danceName'); dn.textContent = DANCES[i]; dn.hidden = false;
  audio(); playMusic(DANCE_TRACKS[i]);
  if (fromGallery){ $('winInfo').textContent = `${i+1}. dans`; $('bNext').textContent = 'Dans Salonuna dön'; }
  setTimeout(()=>{ if (state==='dance') show('win'); }, fromGallery ? 400 : 1600);
}
function loseLevel(){
  state = 'over'; stopMusic(); SFX.lose();
  $('overInfo').textContent = `${LEVELS[lvl].name}: yolun %${Math.floor(dist/levelLen*100)} kadarını geçtin.`;
  show('over');
}

// ---------- Ana döngü ----------
const clock = new THREE.Clock();
function frame(){
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), .05);
  const t = clock.elapsedTime;
  resetPose();

  if (state === 'run') updateRun(dt);
  else if (state === 'dance') updateDance(dt);
  else if (state === 'menu') { // menüde el sallayan Tuğra
    P.body.position.y = .02*S(t*3); P.shR.rotation.set(0,0,2.5 + .35*S(t*8)); P.elR.rotation.x = .3*S(t*8);
    P.head.rotation.z = .1*S(t*2); P.root.position.x += (0-P.root.position.x)*.1;
    camPos.set(.6, 1.45, -3.6); camLook.set(0, 1.05, 0);
  } else if (state === 'over'){
    P.body.rotation.x = .9; P.body.position.y = -.2; P.shL.rotation.z = -1.4; P.shR.rotation.z = 1.4;
  } else if (state === 'paused'){ poseRun(runT); }

  // Foto kafanın eğilmesi: kafa ve gövdenin z dönüşü sprite'a aktarılır
  P.faceSprite.material.rotation = P.head.rotation.z + P.torso.rotation.z + P.body.rotation.z + P.root.rotation.z;

  // Kamera yumuşak takip
  const k = Math.min(1, dt*(state==='run'?8:3));
  camera.position.lerp(camPos, k);
  if (shake > 0){ camera.position.x += rand(-1,1)*shake; camera.position.y += rand(-1,1)*shake; shake = Math.max(0, shake - dt*1.5); }
  camera.lookAt(camLook);
  renderer.render(scene, camera);
}

function poseRun(ph){
  const s = S(ph), c = C(ph);
  P.hipL.rotation.x = .9*s;  P.hipR.rotation.x = -.9*s;
  P.knL.rotation.x = -.2 - 1.1*Math.max(0, -c); P.knR.rotation.x = -.2 - 1.1*Math.max(0, c);
  P.shL.rotation.x = -.8*s; P.shR.rotation.x = .8*s; P.elL.rotation.x = P.elR.rotation.x = 1.3;
  P.body.rotation.x = -.18; P.body.position.y = .05*Math.abs(c);
}

function updateRun(dt){
  // hız bölüm içinde yavaşça artar
  const sp = speed + 2.2*(dist/levelLen);
  dist += sp*dt; runT += dt*sp*.75; score += sp*dt*.5;
  scrollWorld(dist);

  // Fiziği güncelle
  px += (LANES[lane]-px) * Math.min(1, dt*14);
  if (!grounded){ vy -= 26*dt; py += vy*dt; if (py <= 0){ py = 0; vy = 0; grounded = true; } }
  if (sliding > 0) sliding -= dt;
  if (invul > 0) invul -= dt;

  // Karakter pozu
  if (!grounded){
    P.hipL.rotation.x = P.hipR.rotation.x = 1; P.knL.rotation.x = P.knR.rotation.x = -1.5;
    P.shL.rotation.set(2.4,0,-.4); P.shR.rotation.set(2.4,0,.4); P.body.rotation.x = -.1;
  } else if (sliding > 0){
    P.body.rotation.x = 1.05; P.body.position.y = -.42; P.body.position.z = .1;
    P.hipL.rotation.x = P.hipR.rotation.x = 1.4; P.knL.rotation.x = -.3; P.knR.rotation.x = -.6;
    P.shL.rotation.set(1.2,0,-.6); P.shR.rotation.set(1.2,0,.6);
  } else poseRun(runT);
  P.root.position.set(px, py, 0);
  P.root.rotation.z = (px - LANES[lane]) * .12;
  P.root.visible = invul <= 0 || Math.floor(invul*12)%2 === 0;

  // Yeni engel desenleri ve dekor üret
  while (nextSpawn < dist + 120 && nextSpawn < levelLen - 30){
    spawnPattern(nextSpawn); nextSpawn += sp*.95 + rand(4, 10) + Math.max(0, 6 - lvl);
  }
  while (nextDecor < dist + 150){ addDecor(nextDecor, -1, LEVELS[lvl]); addDecor(nextDecor + rand(8,14), 1, LEVELS[lvl]); nextDecor += rand(20,28); }

  // Oyuncu çarpışma kutusu
  const pTop = py + (sliding>0 ? .7 : 1.55), pBot = py;
  for (let i = obstacles.length-1; i >= 0; i--){
    const o = obstacles[i];
    if (o.vz) { o.od -= o.vz*dt; o.spin.rotation.x -= (sp+o.vz)*dt/.62; }
    if (o.lateral){ o.phase += dt*o.freq; o.x = o.base + o.amp*S(o.phase); }
    const z = -(o.od - dist);
    o.mesh.position.set(o.x, 0, z);
    if (z > 12){ levelGroup.remove(o.mesh); obstacles.splice(i,1); continue; }
    if (!o.hit && invul <= 0 && Math.abs(z) < o.hd + .3 && Math.abs(o.x - px) < o.hw + .3 && pBot < o.yMax && pTop > o.yMin){
      o.hit = true; hearts--; invul = 1.5; shake = .25; SFX.hit(); updateHUD();
      if (o.kind === 'ball'){ levelGroup.remove(o.mesh); obstacles.splice(i,1); }
      if (hearts <= 0){ loseLevel(); return; }
      toast('Ay! Dikkat!', 600);
    }
  }
  for (let i = items.length-1; i >= 0; i--){
    const it = items[i], z = -(it.od - dist);
    it.mesh.position.z = z; it.mesh.rotation.y += dt*2.5; it.mesh.position.y = it.y + .08*S(dist*.5 + i);
    if (z > 8){ levelGroup.remove(it.mesh); items.splice(i,1); continue; }
    if (Math.abs(z) < .9 && Math.abs(it.x - px) < 1 && Math.abs(it.y - (py + .6)) < 1.1){
      collected++; score += 25; SFX.pick(); toast('+' + ITEM_KINDS[it.kind].name, 500);
      levelGroup.remove(it.mesh); items.splice(i,1); updateHUD();
    }
  }
  for (let i = decor.length-1; i >= 0; i--){ const d = decor[i], z = -(d.od - dist); d.mesh.position.set(d.x,0,z);
    if (z > 20){ levelGroup.remove(d.mesh); decor.splice(i,1); } }
  // Kapı yaklaşınca açılır
  if (door){ const z = -(door.od - dist); door.g.position.z = z; door.hinge.rotation.y = -Math.min(1.6, Math.max(0, (40 + z)/25)) ; }
  if (dist >= levelLen){ winLevel(); return; }
  updateHUD();

  // Kamera: arkadan, biraz yukarıdan (dev ev hissi için alçak)
  camPos.set(px*.55, 2.9 + py*.3, 6.2); camLook.set(px*.5, 1.2 + py*.2, -6);
}

function updateDance(dt){
  danceT += dt;
  P.root.position.x += (0 - P.root.position.x)*Math.min(1, dt*4); P.root.position.y = 0; P.root.rotation.set(0,0,0);
  const b = danceT * DANCE_BPM[danceIdx] / 60;
  DANCE_FN[danceIdx](b, danceT);
  // Kamera önden, hafifçe sağa-sola döner
  const th = .55*S(danceT*.5), R = 3.4;
  camPos.set(R*S(th), 1.5 + .2*S(danceT*.7), -R*C(th)); camLook.set(P.root.position.x, 1.15, 0);
  // Disko ışıkları dönsün
  discoLights.forEach((l,i)=>{ const a = danceT*1.6 + i*2.1; l.position.set(3*C(a), 3.2, -1 + 3*S(a)); });
  // Konfeti yağsın
  for (let i=0;i<CONF_N;i++){ confPos[i*3+1] -= confVel[i]*dt; confPos[i*3] += S(danceT*2+i)*dt*.4;
    if (confPos[i*3+1] < 0){ confPos[i*3+1] = 7; confPos[i*3] = rand(-5,5); } }
  confGeo.attributes.position.needsUpdate = true;
}

goMenu();
frame();
</script>
